name: Links

# External documentation links. Internal links already fail the CI "links" job;
# a red run here is a heads-up, not a pull request gate. Mondays at 14:00 UTC,
# an hour after audit.yml.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  links-external:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pins as the CI links job; bump lycheeVersion with the action SHA.
      # The action passes github.token, which raises GitHub's rate limits. 429
      # counts as reachable: a rate-limited site is not a broken link.
      - name: Check external documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --no-progress
            --verbose
            --max-retries 3
            --retry-wait-time 2
            --timeout 20
            --accept '200..=299,429'
            './**/*.md'
