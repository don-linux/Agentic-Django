# Fast checks on every commit. Install once: see docs/development.md#pre-commit.
# mypy and pytest stay in the dev container and CI. Keep revs in sync with
# pyproject.toml (ruff, django-upgrade), the uv version in
# .github/actions/setup-python-env, and the CI gitleaks job.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # JSONC (comments allowed)
        exclude: ^(\.devcontainer/devcontainer\.json|\.vscode/.*\.json)$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # The hooks already pass --force-exclude, so pyproject.toml excludes
      # (migrations, .agents) apply to the files pre-commit names. --no-cache: a
      # dev container built with another HOST_UID can leave .ruff_cache
      # unwritable here.
      - id: ruff-check
        args: [--fix, --no-cache]
      - id: ruff-format
        args: [--no-cache]

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.1"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      # Check only: run `uv lock` yourself when pyproject.toml changes.
      - id: uv-lock
        args: [--check]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Reads .gitleaks.toml from the repository root.
      - id: gitleaks

  # Markdown style. Dependabot updates this hook (unlike uv and gitleaks).
  # CI runs it through the existing pre-commit step; there is no second
  # markdownlint action, so the pin cannot drift.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
