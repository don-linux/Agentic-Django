# Fast checks on every commit. Install once: see docs/development.md#pre-commit.
# mypy, pyright and pytest stay in the dev container and CI. Keep revs in sync with
# pyproject.toml (ruff, django-upgrade), the uv version in
# .github/actions/setup-python-env, and the CI gitleaks job.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # JSONC (comments allowed)
        exclude: ^(\.devcontainer/devcontainer\.json|\.vscode/.*\.json)$
      - id: check-merge-conflict
      # --enforce-all: also the files already committed, so CI's --all-files
      # run checks something.
      - id: check-added-large-files
        args: [--enforce-all]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # The hooks already pass --force-exclude, so pyproject.toml excludes
      # (migrations, .agents) apply to the files pre-commit names. --no-cache: a
      # dev container built with another HOST_UID can leave .ruff_cache
      # unwritable here.
      - id: ruff-check
        args: [--fix, --no-cache]
      - id: ruff-format
        args: [--no-cache]

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.1"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      # Check only: run `uv lock` yourself when pyproject.toml changes.
      - id: uv-lock
        args: [--check]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Reads .gitleaks.toml from the repository root. It scans the staged
      # changes of a commit, so CI skips it (SKIP=gitleaks) and its secrets job
      # scans the whole history instead.
      - id: gitleaks

  # Markdown style. Dependabot updates this hook (unlike uv and gitleaks), and
  # CI runs it through the pre-commit step: this rev is the only pin.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2
