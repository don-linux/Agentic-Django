# The version is the markdownlint-cli2 hook's rev in .pre-commit-config.yaml.
# Docs are long-line prose, so MD013 (line length) is off; .editorconfig only
# special-cases trailing whitespace in Markdown.
# MD024 is siblings-only so reused recipe headings in docs/data.md are allowed.
config:
  default: true
  MD013: false
  MD024:
    siblings_only: true

globs:
  - "**/*.md"

ignores:
  - "graphify-out/**"
  - "**/node_modules/**"
  - ".venv/**"
