info:
  name: Salud viva
  type: http
  seq: 2
  tags:
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/health/live/"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: startsWith
      value: "ok"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
