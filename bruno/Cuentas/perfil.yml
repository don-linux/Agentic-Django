info:
  name: Obtener perfil
  type: http
  seq: 4
  tags:
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/me/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body?.id) bru.setVar("userId", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
    - expression: res.body.url
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
