# The lychee version is lycheeVersion in .github/workflows/ci.yml. CI passes
# --offline on pull requests; the scheduled workflow runs without that flag to
# check external URLs.
verbose = "info"
no_progress = true
hidden = true
include_mail = false
include_verbatim = false
include_fragments = "anchor-only"

exclude = [
  '^https?://localhost(:[0-9]+)?',
  '^https?://127\.0\.0\.1(:[0-9]+)?',
  '^https?://(www\.)?example\.com',
  '^https?://.+\.invalid',
  '^https://\{',
  '^https://\$',
  '^https://\.\.\.',
]

# Local, untracked trees: './**/*.md' is expanded without .gitignore, and
# hidden = true would reach uv's .venv (core/tests/test_lychee_config.py).
# .claude/skills links to .agents/skills, which is scanned once already; through
# the link, a skill's relative links would resolve from the wrong folder.
exclude_path = [
  '(^|/)graphify-out/',
  '(^|/)\.venv/',
  '(^|/)\.claude/',
]
